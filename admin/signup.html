<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockIQ — Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-4">
        <span class="text-2xl">📦</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Create your StockIQ account</h1>
      <p class="text-sm text-gray-500 mt-1">14-day free trial — no credit card required</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <!-- Trial banner -->
      <div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 mb-6">
        <span class="text-indigo-600">✨</span>
        <p class="text-sm text-indigo-700 font-medium">Your 14-day free trial starts today</p>
      </div>

      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input id="name" type="text" required placeholder="Jane Smith"
            class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Work Email</label>
          <input id="email" type="email" required placeholder="jane@company.com"
            class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" type="password" required placeholder="Min. 8 characters"
            class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm"></div>

        <button type="submit" id="submitBtn"
          class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 disabled:opacity-50 transition-colors">
          Start Free Trial
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="/account/login" class="text-indigo-600 hover:underline font-medium">Sign in</a>
      </p>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      By creating an account you agree to our Terms of Service.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const portalId = params.get('portal_id');

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/account/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            portal_id: portalId || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = data.redirect;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Start Free Trial';
      }
    }
  </script>
</body>
</html>
