<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockIQ — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-4">
        <span class="text-2xl">📦</span>
      </div>
      <h1 class="text-2xl font-bold text-white">StockIQ Admin</h1>
      <p class="text-sm text-gray-400 mt-1">Owner access only</p>
    </div>

    <div class="bg-gray-800 rounded-2xl border border-gray-700 p-8">

      <script>
        const params = new URLSearchParams(location.search);
        const error = params.get('error');
        if (error) {
          const msgs = {
            invalid: 'Incorrect password.',
            session: 'Session error — please try again.',
            not_configured: 'SUPERADMIN_PASSWORD is not set on the server.',
          };
          document.write(`<div class="mb-4 bg-red-900/40 border border-red-700 text-red-300 rounded-xl px-4 py-3 text-sm">${msgs[error] || 'Login failed.'}</div>`);
        }
      </script>

      <form method="POST" action="/superadmin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
          <input name="password" type="password" required placeholder="Admin password" autofocus
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <button type="submit"
          class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
