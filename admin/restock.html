<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockIQ — Restock</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">📦 StockIQ — Restock</h1>
      <p id="portalBadge" class="text-sm text-gray-500 mt-1"></p>
    </div>

    <!-- Nav -->
    <div class="flex gap-4 mb-6 text-sm">
      <a id="navProducts" href="#" class="text-gray-500 hover:text-gray-700">Products</a>
      <span class="font-medium text-indigo-600 border-b-2 border-indigo-600 pb-1">Restock</span>
      <a id="navMovements" href="#" class="text-gray-500 hover:text-gray-700">Movements</a>
      <a id="navReservations" href="#" class="text-gray-500 hover:text-gray-700">Reservations</a>
      <a id="navSettings" href="#" class="text-gray-500 hover:text-gray-700">Settings</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <!-- Product Search -->
      <div class="mb-5 relative">
        <label class="block text-sm font-medium text-gray-700 mb-1">Search Product</label>
        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Type product name or SKU…"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          oninput="handleSearch()"
        />
        <ul id="dropdown"
          class="hidden absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 max-h-48 overflow-y-auto">
        </ul>
      </div>

      <!-- Selected product info -->
      <div id="selectedInfo" class="hidden mb-5 bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-3">
        <p class="text-sm text-gray-700">Selected: <span id="selectedName" class="font-semibold text-gray-900"></span></p>
        <p class="text-sm text-gray-500 mt-0.5">SKU: <span id="selectedSku" class="font-mono"></span></p>
        <p class="text-sm text-indigo-700 mt-0.5 font-medium">Currently: <span id="selectedQty"></span> units</p>
      </div>

      <!-- Quantity -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Received</label>
        <input
          id="qtyInput"
          type="number"
          min="1"
          placeholder="e.g. 50"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- PO Reference -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">PO Reference <span class="text-gray-400 font-normal">(optional)</span></label>
        <input
          id="refInput"
          type="text"
          placeholder="e.g. PO-2024-001"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Alerts -->
      <div id="successMsg" class="hidden mb-4 bg-green-50 border border-green-200 text-green-800 rounded-lg px-4 py-3 text-sm"></div>
      <div id="errorMsg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-800 rounded-lg px-4 py-3 text-sm"></div>

      <button
        id="submitBtn"
        onclick="submitRestock()"
        class="w-full bg-indigo-600 text-white rounded-lg py-2.5 font-medium hover:bg-indigo-700 disabled:opacity-50"
      >
        Submit Restock
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const portalId = params.get('portal_id');
    let selectedProduct = null;
    let searchTimer = null;

    if (!portalId) {
      document.body.innerHTML = '<div class="p-8 text-red-600">Missing portal_id parameter.</div>';
    }

    document.getElementById('portalBadge').textContent = `Portal ID: ${portalId}`;
    document.getElementById('navProducts').href = `/admin/products?portal_id=${portalId}`;
    document.getElementById('navMovements').href = `/admin/movements?portal_id=${portalId}`;
    document.getElementById('navReservations').href = `/admin/reservations?portal_id=${portalId}`;
    document.getElementById('navSettings').href = `/admin/settings?portal_id=${portalId}`;

    function handleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(doSearch, 250);
    }

    async function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const dropdown = document.getElementById('dropdown');

      if (q.length < 1) {
        dropdown.classList.add('hidden');
        return;
      }

      try {
        const res = await fetch(`/api/stock/${portalId}/search?q=${encodeURIComponent(q)}`);
        const products = await res.json();
        if (!products.length) {
          dropdown.innerHTML = '<li class="px-3 py-2 text-sm text-gray-400">No products found</li>';
        } else {
          dropdown.innerHTML = products.map(p =>
            `<li
              class="px-3 py-2 text-sm text-gray-800 hover:bg-indigo-50 cursor-pointer"
              onclick='selectProduct(${JSON.stringify({id: p.hs_product_id, name: p.name, sku: p.sku, qty: p.quantity})})'
            >
              <span class="font-medium">${escHtml(p.name)}</span>
              <span class="text-gray-400 ml-2 font-mono text-xs">${escHtml(p.sku || '')}</span>
            </li>`
          ).join('');
        }
        dropdown.classList.remove('hidden');
      } catch (err) {
        console.error('Search error:', err);
      }
    }

    function selectProduct(product) {
      selectedProduct = product;
      document.getElementById('searchInput').value = product.name;
      document.getElementById('dropdown').classList.add('hidden');
      document.getElementById('selectedName').textContent = product.name;
      document.getElementById('selectedSku').textContent = product.sku || '—';
      document.getElementById('selectedQty').textContent = product.qty;
      document.getElementById('selectedInfo').classList.remove('hidden');
    }

    async function submitRestock() {
      const successEl = document.getElementById('successMsg');
      const errorEl = document.getElementById('errorMsg');
      successEl.classList.add('hidden');
      errorEl.classList.add('hidden');

      if (!selectedProduct) {
        errorEl.textContent = 'Please search and select a product first.';
        errorEl.classList.remove('hidden');
        return;
      }

      const qty = parseInt(document.getElementById('qtyInput').value, 10);
      if (isNaN(qty) || qty < 1) {
        errorEl.textContent = 'Quantity received must be at least 1.';
        errorEl.classList.remove('hidden');
        return;
      }

      const reference = document.getElementById('refInput').value.trim();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const res = await fetch(`/api/stock/${portalId}/restock`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            hs_product_id: selectedProduct.id,
            quantity_received: qty,
            reference: reference || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Restock failed');

        const sku = data.sku || selectedProduct.sku;
        successEl.textContent = `Updated. ${sku || selectedProduct.name} now has ${data.quantity} units.`;
        successEl.classList.remove('hidden');

        // Reset form
        selectedProduct = null;
        document.getElementById('searchInput').value = '';
        document.getElementById('qtyInput').value = '';
        document.getElementById('refInput').value = '';
        document.getElementById('selectedInfo').classList.add('hidden');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Restock';
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchInput') && !e.target.closest('#dropdown')) {
        document.getElementById('dropdown').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
