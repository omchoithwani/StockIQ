<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockIQ — Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<script src="/admin/plan-banner.js" defer></script>

  <!-- Bulk Import Modal -->
  <div id="importModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h2 class="text-lg font-semibold text-gray-900">Bulk Import</h2>
        <button onclick="closeImport()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-gray-100 px-6">
        <button onclick="setImportTab('restock')" id="tabRestock"
          class="px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600 -mb-px">Bulk Restock</button>
        <button onclick="setImportTab('adjust')" id="tabAdjust"
          class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px">Bulk Adjust</button>
      </div>

      <div class="px-6 py-4 overflow-y-auto flex-1">
        <!-- Instructions -->
        <div id="importInstructions" class="mb-4">
          <p id="importDesc" class="text-sm text-gray-600 mb-3"></p>
          <div class="flex gap-2 mb-4">
            <button onclick="downloadTemplate()" class="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">
              ⬇ Download Template CSV
            </button>
            <button onclick="downloadExport()" class="flex items-center gap-1.5 text-xs px-3 py-1.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">
              ⬇ Download Current Stock (pre-filled)
            </button>
          </div>

          <!-- Upload area -->
          <label for="csvFile"
            class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-50 text-gray-400 text-sm">
            <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            Click to upload CSV or drag & drop
            <input id="csvFile" type="file" accept=".csv" class="hidden" onchange="handleCsvUpload(event)" />
          </label>
        </div>

        <!-- Preview table -->
        <div id="previewSection" class="hidden">
          <div class="flex items-center justify-between mb-2">
            <p class="text-sm font-medium text-gray-700" id="previewTitle"></p>
            <button onclick="clearPreview()" class="text-xs text-gray-400 hover:text-gray-600">Clear</button>
          </div>
          <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-xs">
              <thead class="bg-gray-50"><tr id="previewHead"></tr></thead>
              <tbody id="previewBody"></tbody>
            </table>
          </div>
        </div>

        <div id="importResult" class="hidden mt-3 text-sm rounded-lg px-4 py-3"></div>
      </div>

      <div class="px-6 py-4 border-t border-gray-100 flex gap-2 justify-end">
        <button onclick="closeImport()" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50">Cancel</button>
        <button onclick="confirmImport()" id="confirmImportBtn"
          class="hidden px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50">
          Confirm Import
        </button>
      </div>
    </div>
  </div>

  <!-- Adjust Modal -->
  <div id="adjustModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm">
      <h2 class="text-lg font-semibold mb-4">Adjust Stock</h2>
      <p class="text-sm text-gray-500 mb-1">Product: <span id="modalProductName" class="font-medium text-gray-800"></span></p>
      <p class="text-sm text-gray-500 mb-4">Current stock: <span id="modalCurrentQty" class="font-medium text-gray-800"></span></p>
      <label class="block text-sm font-medium text-gray-700 mb-1">New Quantity</label>
      <input id="modalNewQty" type="number" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="0" />
      <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
      <input id="modalReason" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Counted inventory" />
      <div class="flex gap-2 justify-end">
        <button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50">Cancel</button>
        <button onclick="submitAdjust()" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Save</button>
      </div>
      <p id="modalError" class="mt-2 text-sm text-red-500 hidden"></p>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">📦 StockIQ — Products</h1>
        <p id="portalBadge" class="text-sm text-gray-500 mt-1"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="downloadExport()" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 text-sm font-medium">
          ⬇ Export CSV
        </button>
        <button onclick="openImport()" class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 text-sm font-medium">
          ⬆ Import CSV
        </button>
        <button id="syncBtn" onclick="syncProducts()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Sync from HubSpot
        </button>
      </div>
    </div>

    <!-- Nav -->
    <div class="flex gap-4 mb-6 text-sm">
      <span class="font-medium text-indigo-600 border-b-2 border-indigo-600 pb-1">Products</span>
      <a id="navRestock" href="#" class="text-gray-500 hover:text-gray-700">Restock</a>
      <a id="navMovements" href="#" class="text-gray-500 hover:text-gray-700">Movements</a>
      <a id="navReservations" href="#" class="text-gray-500 hover:text-gray-700">Reservations</a>
      <a id="navSettings" href="#" class="text-gray-500 hover:text-gray-700">Settings</a>
      <a id="navBilling" href="#" class="text-gray-500 hover:text-gray-700">Billing</a>
    </div>

    <!-- Alerts -->
    <div id="syncSuccess" class="hidden mb-4 bg-green-50 border border-green-200 text-green-800 rounded-lg px-4 py-3 text-sm"></div>
    <div id="syncError" class="hidden mb-4 bg-red-50 border border-red-200 text-red-800 rounded-lg px-4 py-3 text-sm"></div>

    <!-- Stats -->
    <div id="statsRow" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6"></div>

    <!-- Mass-select toolbar -->
    <div id="massBar" class="hidden mb-3 flex items-center gap-3 bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-2">
      <span id="massCount" class="text-sm font-medium text-indigo-700"></span>
      <span class="text-indigo-300">|</span>
      <label class="text-sm text-indigo-700">Set threshold:
        <input id="massThreshInput" type="number" min="0" value="10"
          class="ml-1 w-16 border border-indigo-300 rounded px-2 py-0.5 text-sm text-center focus:outline-none focus:ring-1 focus:ring-indigo-500" />
      </label>
      <button onclick="applyMassThreshold()" class="px-3 py-1 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Apply to Selected</button>
      <button onclick="clearSelection()" class="ml-auto text-xs text-indigo-400 hover:text-indigo-600">Clear selection</button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-4 py-3 w-8">
              <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"
                class="w-4 h-4 rounded text-indigo-600 border-gray-300" />
            </th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Product Name</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">SKU</th>
            <th class="text-right px-4 py-3 font-medium text-gray-600">On Hand</th>
            <th class="text-right px-4 py-3 font-medium text-gray-600">Reserved</th>
            <th class="text-right px-4 py-3 font-medium text-gray-600">Available</th>
            <th class="text-center px-4 py-3 font-medium text-gray-600">Status</th>
            <th class="text-right px-4 py-3 font-medium text-gray-600" title="Click any threshold value to edit it">Threshold ✎</th>
            <th class="text-left px-4 py-3 font-medium text-gray-600">Last Updated</th>
            <th class="text-center px-4 py-3 font-medium text-gray-600">Action</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr>
            <td colspan="10" class="text-center py-12 text-gray-400">Loading products…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const portalId = params.get('portal_id');
    let adjustingProduct = null;

    if (!portalId) {
      document.body.innerHTML = '<div class="p-8 text-red-600">Missing portal_id parameter. <a href="/oauth/install" class="underline">Install StockIQ</a></div>';
    }

    document.getElementById('portalBadge').textContent = `Portal ID: ${portalId}`;
    document.getElementById('navRestock').href = `/admin/restock?portal_id=${portalId}`;
    document.getElementById('navMovements').href = `/admin/movements?portal_id=${portalId}`;
    document.getElementById('navReservations').href = `/admin/reservations?portal_id=${portalId}`;
    document.getElementById('navSettings').href = `/admin/settings?portal_id=${portalId}`;
    document.getElementById('navBilling').href = `/account/billing?portal_id=${portalId}`;

    function statusBadge(product) {
      if (!product.is_active) return '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">Inactive</span>';
      if (product.quantity === 0) return '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">Out of Stock</span>';
      if (product.available === 0 && product.reserved > 0) return '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-700">Fully Reserved</span>';
      if (product.available < product.low_stock_threshold) return '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-700">Low Stock</span>';
      return '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">In Stock</span>';
    }

    function fmtDate(ts) {
      if (!ts) return '—';
      return new Date(Number(ts)).toLocaleString();
    }

    function renderStats(products) {
      const active = products.filter(p => p.is_active);
      const inStock = active.filter(p => p.available >= p.low_stock_threshold).length;
      const low = active.filter(p => p.available > 0 && p.available < p.low_stock_threshold).length;
      const out = active.filter(p => p.quantity === 0).length;
      const totalReserved = active.reduce((sum, p) => sum + (p.reserved || 0), 0);
      const totalAvailable = active.reduce((sum, p) => sum + (p.available || 0), 0);

      const stats = [
        { label: 'In Stock', value: inStock, color: 'text-green-600', sub: null },
        { label: 'Low / Out of Stock', value: low + out, color: 'text-yellow-600', sub: null },
        { label: 'Units Reserved', value: totalReserved, color: 'text-indigo-600', sub: 'held by open deals' },
        { label: 'Units Available', value: totalAvailable, color: 'text-gray-900', sub: 'free to sell' },
      ];

      document.getElementById('statsRow').innerHTML = stats.map(s =>
        `<div class="bg-white rounded-xl border border-gray-200 shadow-sm px-4 py-3">
          <p class="text-xs text-gray-500 mb-1">${s.label}</p>
          <p class="text-2xl font-bold ${s.color}">${s.value}</p>
          ${s.sub ? `<p class="text-xs text-gray-400 mt-0.5">${s.sub}</p>` : ''}
        </div>`
      ).join('');
    }

    async function loadProducts() {
      try {
        const res = await fetch(`/api/stock/${portalId}`);
        const products = await res.json();
        renderStats(products);

        const tbody = document.getElementById('productTable');
        if (!products.length) {
          tbody.innerHTML = '<tr><td colspan="10" class="text-center py-12 text-gray-400">No products found. Click "Sync from HubSpot" to import.</td></tr>';
          return;
        }

        tbody.innerHTML = products.map(p => `
          <tr class="border-t border-gray-100 hover:bg-gray-50" id="row-${p.hs_product_id}">
            <td class="px-4 py-3 w-8">
              <input type="checkbox" value="${escHtml(p.hs_product_id)}" onchange="onRowCheck()"
                class="row-check w-4 h-4 rounded text-indigo-600 border-gray-300" />
            </td>
            <td class="px-4 py-3 font-medium text-gray-900">${escHtml(p.name)}</td>
            <td class="px-4 py-3 text-gray-500 font-mono text-xs">${escHtml(p.sku || '—')}</td>
            <td class="px-4 py-3 text-right font-semibold text-gray-800">${p.quantity}</td>
            <td class="px-4 py-3 text-right font-semibold ${p.reserved > 0 ? 'text-indigo-600' : 'text-gray-300'}">${p.reserved > 0 ? p.reserved : '—'}</td>
            <td class="px-4 py-3 text-right font-semibold ${p.available === 0 ? 'text-red-600' : p.available < p.low_stock_threshold ? 'text-yellow-600' : 'text-green-600'}">${p.available}</td>
            <td class="px-4 py-3 text-center">${statusBadge(p)}</td>
            <td class="px-4 py-3 text-right" id="thresh-cell-${p.hs_product_id}">
              <span
                class="inline-block px-2 py-0.5 rounded cursor-pointer text-gray-600 font-mono text-xs border border-transparent hover:border-gray-300 hover:bg-gray-50"
                title="Click to edit threshold"
                onclick='editThreshold("${escHtml(p.hs_product_id)}", ${p.low_stock_threshold ?? 10})'>
                ${p.low_stock_threshold ?? 10}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-400 text-xs">${fmtDate(p.updated_at)}</td>
            <td class="px-4 py-3 text-center">
              <button onclick='openModal(${JSON.stringify({id: p.hs_product_id, name: p.name, qty: p.quantity})})'
                class="px-3 py-1 text-xs rounded-md border border-gray-300 hover:bg-gray-50 text-gray-700">Adjust</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('productTable').innerHTML =
          `<tr><td colspan="10" class="text-center py-12 text-red-500">Error loading products: ${err.message}</td></tr>`;
      }
    }

    async function syncProducts() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = 'Syncing…';
      document.getElementById('syncSuccess').classList.add('hidden');
      document.getElementById('syncError').classList.add('hidden');
      try {
        const res = await fetch(`/api/stock/${portalId}/sync`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sync failed');
        const msg = document.getElementById('syncSuccess');
        msg.textContent = `Sync complete — ${data.created} created, ${data.updated} updated (${data.total} total products).`;
        msg.classList.remove('hidden');
        await loadProducts();
      } catch (err) {
        const msg = document.getElementById('syncError');
        msg.textContent = `Sync error: ${err.message}`;
        msg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Sync from HubSpot`;
      }
    }

    function openModal(product) {
      adjustingProduct = product;
      document.getElementById('modalProductName').textContent = product.name;
      document.getElementById('modalCurrentQty').textContent = product.qty + ' units';
      document.getElementById('modalNewQty').value = product.qty;
      document.getElementById('modalReason').value = '';
      document.getElementById('modalError').classList.add('hidden');
      document.getElementById('adjustModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('adjustModal').classList.add('hidden');
      adjustingProduct = null;
    }

    async function submitAdjust() {
      const newQty = parseInt(document.getElementById('modalNewQty').value, 10);
      const reason = document.getElementById('modalReason').value.trim();
      const errEl = document.getElementById('modalError');

      if (isNaN(newQty) || newQty < 0) {
        errEl.textContent = 'Please enter a valid quantity (0 or more).';
        errEl.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`/api/stock/${portalId}/adjust`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hs_product_id: adjustingProduct.id, new_quantity: newQty, reason }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Adjust failed');
        closeModal();
        await loadProducts();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function editThreshold(hsProductId, currentValue) {
      const cell = document.getElementById(`thresh-cell-${hsProductId}`);
      if (!cell) return;
      cell.innerHTML = `
        <input
          type="number" min="0" value="${currentValue}"
          class="w-16 text-right border border-indigo-400 rounded px-1 py-0.5 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-indigo-500"
          id="thresh-input-${hsProductId}"
          onkeydown="handleThreshKey(event, '${hsProductId}')"
          onblur="saveThreshold('${hsProductId}')"
        />
      `;
      const input = document.getElementById(`thresh-input-${hsProductId}`);
      input.focus();
      input.select();
    }

    function handleThreshKey(event, hsProductId) {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveThreshold(hsProductId);
      } else if (event.key === 'Escape') {
        loadProducts(); // re-render to discard
      }
    }

    async function saveThreshold(hsProductId) {
      const input = document.getElementById(`thresh-input-${hsProductId}`);
      if (!input) return; // already saved
      const newThreshold = parseInt(input.value, 10);
      if (isNaN(newThreshold) || newThreshold < 0) {
        loadProducts();
        return;
      }
      // Optimistically update the cell immediately
      const cell = document.getElementById(`thresh-cell-${hsProductId}`);
      cell.innerHTML = `<span class="inline-block px-2 py-0.5 rounded text-gray-400 font-mono text-xs">saving…</span>`;

      try {
        const res = await fetch(`/api/stock/${portalId}/threshold`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hs_product_id: hsProductId, threshold: newThreshold }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        // Re-render just the cell with the saved value
        cell.innerHTML = `
          <span
            class="inline-block px-2 py-0.5 rounded cursor-pointer text-gray-600 font-mono text-xs border border-transparent hover:border-gray-300 hover:bg-gray-50"
            title="Click to edit threshold"
            onclick='editThreshold("${hsProductId}", ${newThreshold})'>
            ${newThreshold}
          </span>`;
      } catch (err) {
        cell.innerHTML = `<span class="text-red-500 text-xs" title="${err.message}">error</span>`;
        setTimeout(loadProducts, 1500);
      }
    }

    // ── Export ──────────────────────────────────────────────────────────────
    function downloadExport() {
      window.location.href = `/api/stock/${portalId}/export`;
    }

    // ── Import modal ─────────────────────────────────────────────────────────
    let importTab = 'restock';
    let parsedRows = [];

    const tabDescs = {
      restock: 'Add stock to existing quantities. Required columns: <code>sku</code>, <code>quantity_to_add</code>.',
      adjust:  'Set exact quantities. Required columns: <code>sku</code>, <code>new_quantity</code>. Optional: <code>threshold</code>.',
    };

    function openImport() {
      document.getElementById('importModal').classList.remove('hidden');
      setImportTab('restock');
    }

    function closeImport() {
      document.getElementById('importModal').classList.add('hidden');
      clearPreview();
    }

    function setImportTab(tab) {
      importTab = tab;
      document.getElementById('tabRestock').className = tab === 'restock'
        ? 'px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600 -mb-px'
        : 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px';
      document.getElementById('tabAdjust').className = tab === 'adjust'
        ? 'px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600 -mb-px'
        : 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px';
      document.getElementById('importDesc').innerHTML = tabDescs[tab];
      clearPreview();
    }

    function downloadTemplate() {
      const headers = importTab === 'restock'
        ? 'sku,quantity_to_add'
        : 'sku,new_quantity,threshold';
      const blob = new Blob([headers + '\n'], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `stockiq-${importTab}-template.csv`;
      a.click();
    }

    function handleCsvUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => parseCsv(e.target.result);
      reader.readAsText(file);
      event.target.value = ''; // reset so same file can be re-uploaded
    }

    function parseCsv(text) {
      const lines = text.trim().split('\n').filter(Boolean);
      if (lines.length < 2) return showImportResult('CSV must have a header row and at least one data row.', 'error');

      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
      parsedRows = lines.slice(1).map(line => {
        // simple CSV parse (handles quoted fields)
        const vals = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$|^(?=,))/g) || [];
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, '').trim(); });
        return obj;
      });

      // Validate required columns
      const requiredCols = importTab === 'restock' ? ['sku', 'quantity_to_add'] : ['sku', 'new_quantity'];
      const missing = requiredCols.filter(c => !headers.includes(c));
      if (missing.length) {
        return showImportResult(`Missing required columns: ${missing.join(', ')}`, 'error');
      }

      renderPreview();
    }

    function renderPreview() {
      const isRestock = importTab === 'restock';
      const headCols = isRestock
        ? ['SKU', 'Add Qty']
        : ['SKU', 'New Qty', 'Threshold'];

      document.getElementById('previewHead').innerHTML =
        headCols.map(h => `<th class="px-3 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wide">${h}</th>`).join('');

      document.getElementById('previewBody').innerHTML = parsedRows.map(row => {
        if (isRestock) {
          return `<tr class="border-t border-gray-100">
            <td class="px-3 py-1.5 font-mono text-gray-700">${escHtml(row.sku || '')}</td>
            <td class="px-3 py-1.5 text-green-600 font-semibold">+${escHtml(row.quantity_to_add || '0')}</td>
          </tr>`;
        } else {
          return `<tr class="border-t border-gray-100">
            <td class="px-3 py-1.5 font-mono text-gray-700">${escHtml(row.sku || '')}</td>
            <td class="px-3 py-1.5 font-semibold text-gray-800">${escHtml(row.new_quantity || '—')}</td>
            <td class="px-3 py-1.5 text-gray-500">${escHtml(row.threshold || '—')}</td>
          </tr>`;
        }
      }).join('');

      document.getElementById('previewTitle').textContent = `${parsedRows.length} row(s) ready to import`;
      document.getElementById('previewSection').classList.remove('hidden');
      document.getElementById('confirmImportBtn').classList.remove('hidden');
      document.getElementById('importResult').classList.add('hidden');
    }

    function clearPreview() {
      parsedRows = [];
      document.getElementById('previewSection').classList.add('hidden');
      document.getElementById('confirmImportBtn').classList.add('hidden');
      document.getElementById('importResult').classList.add('hidden');
      document.getElementById('csvFile').value = '';
    }

    async function confirmImport() {
      const btn = document.getElementById('confirmImportBtn');
      btn.disabled = true;
      btn.textContent = 'Importing…';

      const endpoint = importTab === 'restock' ? 'bulk-restock' : 'bulk-adjust';
      try {
        const res = await fetch(`/api/stock/${portalId}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rows: parsedRows }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        let msg = `✅ ${data.updated} product(s) updated.`;
        if (data.skipped?.length) msg += ` ⚠️ ${data.skipped.length} skipped: ${data.skipped.map(s => `${s.sku} (${s.reason})`).join(', ')}.`;
        if (data.errors?.length) msg += ` ❌ ${data.errors.length} errors.`;
        showImportResult(msg, data.errors?.length ? 'warning' : 'success');
        clearPreview();
        await loadProducts();
      } catch (err) {
        showImportResult(`Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm Import';
      }
    }

    function showImportResult(msg, type) {
      const el = document.getElementById('importResult');
      const colors = { success: 'bg-green-50 text-green-800 border border-green-200', error: 'bg-red-50 text-red-700 border border-red-200', warning: 'bg-yellow-50 text-yellow-800 border border-yellow-200' };
      el.className = `mt-3 text-sm rounded-lg px-4 py-3 ${colors[type] || colors.success}`;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // ── Mass threshold ────────────────────────────────────────────────────────
    function onRowCheck() {
      const checked = document.querySelectorAll('.row-check:checked');
      const bar = document.getElementById('massBar');
      const selectAll = document.getElementById('selectAll');
      const total = document.querySelectorAll('.row-check').length;
      if (checked.length > 0) {
        bar.classList.remove('hidden');
        document.getElementById('massCount').textContent = `${checked.length} product${checked.length > 1 ? 's' : ''} selected`;
      } else {
        bar.classList.add('hidden');
      }
      selectAll.indeterminate = checked.length > 0 && checked.length < total;
      selectAll.checked = checked.length === total;
    }

    function toggleSelectAll(cb) {
      document.querySelectorAll('.row-check').forEach(c => { c.checked = cb.checked; });
      onRowCheck();
    }

    function clearSelection() {
      document.querySelectorAll('.row-check').forEach(c => { c.checked = false; });
      document.getElementById('selectAll').checked = false;
      document.getElementById('massBar').classList.add('hidden');
    }

    async function applyMassThreshold() {
      const checked = document.querySelectorAll('.row-check:checked');
      const threshold = parseInt(document.getElementById('massThreshInput').value, 10);
      if (isNaN(threshold) || threshold < 0) return;

      const rows = Array.from(checked).map(cb => ({ hs_product_id: cb.value, threshold }));
      const btn = document.querySelector('#massBar button:first-of-type');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch(`/api/stock/${portalId}/bulk-threshold`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rows }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        clearSelection();
        await loadProducts();
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Apply to Selected';
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadProducts();
  </script>
</body>
</html>
